name: Polish
description: SFX / VFX / feel improvements
title: "[Polish] "
labels: ["type: polish"]
body:
  - type: textarea
    id: feeling
    attributes:
      label: Target Feeling
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Current Problem
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      value: |
        - [ ] SFX
        - [ ] VFX
        - [ ] UI feedback
        - [ ] Timing adjustment
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done When
      value: |
        - [ ] Feedback is obvious without Console
